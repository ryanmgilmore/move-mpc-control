# Release: on a v* tag, check the tag against src/module.json and release.json,
# run the tests, build move-mpc-control-module.tar.gz, and attach it to a
# GitHub release. release.json (read by Schwung's Module Store and Schwung
# Manager's "Install Custom Module > From GitHub URL") is updated by hand, with
# src/module.json, before tagging: the workflow never commits.
# After Schwung's BUILDING.md; JavaScript only, so no cross-compiler.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches module.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(jq -r .version src/module.json)
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/module.json version $MODULE_VERSION"
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests
        run: deno test --allow-read --allow-env

      - name: Package
        run: sh scripts/package.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/move-mpc-control-module.tar.gz
          generate_release_notes: true

      - name: release.json points at this release
        # Checked, never written: no bot commits to this repository. Update
        # release.json together with src/module.json before tagging.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/move-mpc-control-module.tar.gz"
          if [ "$(jq -r .version release.json)" != "$VERSION" ] || [ "$(jq -r .download_url release.json)" != "$URL" ]; then
            echo "release.json must have version $VERSION and download_url $URL before tagging $GITHUB_REF_NAME"
            exit 1
          fi
