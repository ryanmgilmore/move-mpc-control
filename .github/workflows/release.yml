# Release: on a v* tag, check the tag against src/module.json, run the tests,
# build move-mpc-control-module.tar.gz, attach it to a GitHub release, and
# point release.json on main at it (Schwung's Module Store and Schwung
# Manager's "Install Custom Module > From GitHub URL" read that file).
# After Schwung's BUILDING.md; JavaScript only, so no cross-compiler.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches module.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(jq -r .version src/module.json)
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/module.json version $MODULE_VERSION"
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests
        run: deno test --allow-read --allow-env

      - name: Package
        run: sh scripts/package.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/move-mpc-control-module.tar.gz
          generate_release_notes: true

      - name: Point release.json at this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > release.json <<JSON
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/move-mpc-control-module.tar.gz"
          }
          JSON
          git add release.json
          git commit -m "release.json: ${GITHUB_REF_NAME}" || echo "release.json unchanged"
          git push origin main
